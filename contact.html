<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Lauren Lamboy</title>
  <meta name="description" content="Get in touch with Lauren Lamboy for photography and content creation work.">
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="contact-page">

  <div class="page-transition"></div>
  <div class="cursor-ring"></div>

  <!-- ─── Navigation ─── -->
  <nav class="nav">
    <a href="/" class="nav-logo">Lauren Lamboy</a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/photo">Photo</a></li>
      <li><a href="/video">Video</a></li>
      <li><a href="/contact" class="active">Contact</a></li>
    </ul>
    <button class="nav-toggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <main>

    <h1 class="contact-heading">
      Let's work<br>together.
    </h1>

    <div class="contact-details">

      <p class="contact-label">Email</p>
      <a href="mailto:lamboylauren@gmail.com" class="contact-email">
        <span aria-hidden="true">→</span>lamboylauren@gmail.com
      </a>

      <div class="contact-divider"></div>

      <p class="contact-label">Elsewhere</p>
      <div class="contact-social-row">
        <a
          href="https://instagram.com/laurenlamboy"
          target="_blank"
          rel="noopener noreferrer"
          class="contact-social"
        >
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5"/>
            <circle cx="12" cy="12" r="4.5"/>
            <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/>
          </svg>
          Instagram &nbsp;↗
        </a>
        <a
          href="https://www.linkedin.com/in/laurenlamboy/"
          target="_blank"
          rel="noopener noreferrer"
          class="contact-social"
        >
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="3"/>
            <line x1="8" y1="11" x2="8" y2="17"/>
            <line x1="8" y1="7" x2="8" y2="8"/>
            <line x1="12" y1="17" x2="12" y2="11"/>
            <path d="M12 14a3 3 0 0 1 6 0v3"/>
          </svg>
          LinkedIn &nbsp;↗
        </a>
        <a
          href="https://www.tiktok.com/@laurenlamboy"
          target="_blank"
          rel="noopener noreferrer"
          class="contact-social"
        >
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"/>
          </svg>
          TikTok &nbsp;↗
        </a>
      </div>

    </div>

  </main>

  <!-- ─── Footer ─── -->
  <footer class="footer">
    <span class="footer-copy">&copy; 2024 Lauren Lamboy</span>
    <ul class="footer-links">
      <li><a href="/">Home</a></li>
      <li><a href="/photo">Photo</a></li>
      <li><a href="/video">Video</a></li>
      <li><a href="/contact">Contact</a></li>
    </ul>
    <div class="footer-social">
      <a href="https://instagram.com/laurenlamboy" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5"/>
          <circle cx="12" cy="12" r="4.5"/>
          <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <a href="mailto:hello@laurenlamboy.com" aria-label="Email">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <polyline points="2,4.5 12,13.5 22,4.5"/>
        </svg>
      </a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
